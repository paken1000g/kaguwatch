
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KAGUWATCH — 家具ウォッチャー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+JP:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f7f6f3;
  --bg2: #ffffff;
  --bg3: #efede8;
  --border: rgba(0,0,0,0.06);
  --border2: rgba(0,0,0,0.11);
  --text: #17171a;
  --text2: #58585e;
  --text3: #9898a2;
  --accent: #2a5c3f;
  --accent-lt: #eaf2ed;
  --accent-md: #3b7a55;
  --red: #b91c1c;
  --red-lt: #fef2f2;
  --blue: #1d4ed8;
  --blue-lt: #eff6ff;
  --amber: #92600a;
  --amber-lt: #fffbeb;
  --radius: 10px;
  --radius-lg: 16px;
  --shadow-sm: 0 1px 2px rgba(0,0,0,.04), 0 2px 6px rgba(0,0,0,.03);
  --shadow: 0 4px 16px rgba(0,0,0,.07), 0 1px 4px rgba(0,0,0,.04);
  --mono: 'DM Mono', monospace;
  --sans: 'Noto Sans JP', sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--text); font-family: var(--sans);
  font-size: 14px; font-weight: 300; min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
.shell { display: flex; flex-direction: column; min-height: 100vh; }

/* ── Top bar ─────────────────────────────── */
.topbar {
  background: var(--bg2); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 12px;
  padding: 0 32px; height: 56px; position: sticky; top: 0; z-index: 10; flex-shrink: 0;
}
.topbar-logo { display: flex; align-items: baseline; gap: 9px; }
.logo-mark { font-family: var(--mono); font-size: 15px; font-weight: 500; color: var(--accent); letter-spacing: .04em; }
.logo-sub { font-size: 11px; font-weight: 300; color: var(--text3); letter-spacing: .02em; }
.topbar-right { margin-left: auto; display: flex; align-items: center; gap: 6px; }
.status-mini { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--text3); margin-right: 4px; }
.sdot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent-md); flex-shrink: 0; transition: background .3s; }
.sdot.loading { background: var(--amber); animation: blink 1.2s infinite; }
.sdot.err { background: var(--red); }
@keyframes blink { 0%,100%{opacity:1}50%{opacity:.3} }
.ct { font-family: var(--mono); font-size: 10px; }
.icon-btn {
  background: none; border: 1px solid var(--border2); border-radius: var(--radius);
  padding: 0 10px; height: 34px; cursor: pointer; font-size: 14px; color: var(--text2);
  transition: all .15s; display: inline-flex; align-items: center; justify-content: center;
}
.icon-btn:hover { border-color: var(--accent); background: var(--accent-lt); color: var(--accent); }

/* ── Error banner ────────────────────────── */
.err-banner {
  display: none; background: var(--red-lt); border-bottom: 1px solid rgba(185,28,28,.1);
  padding: 8px 32px; font-size: 12px; color: var(--red); line-height: 1.6;
}

/* ── Tab bar ─────────────────────────────── */
.main-tabbar {
  background: var(--bg2); border-bottom: 1px solid var(--border);
  display: flex; padding: 0 32px; flex-shrink: 0;
}
.main-tab {
  padding: 13px 20px; font-size: 13px; color: var(--text3);
  border-bottom: 2px solid transparent; cursor: pointer;
  background: none; border-top: none; border-left: none; border-right: none;
  transition: color .15s, border-color .15s; font-weight: 300; font-family: var(--sans);
}
.main-tab:hover { color: var(--text2); }
.main-tab.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 500; }
.tab-badge {
  margin-left: 5px; font-family: var(--mono); font-size: 10px;
  background: var(--accent-lt); color: var(--accent); padding: 1px 6px; border-radius: 99px;
}

/* ── Main / panels ───────────────────────── */
.main { flex: 1; overflow: auto; }
.main-panel { display: none; }
.main-panel.active { display: block; }
.content { padding: 28px 32px; max-width: 1120px; margin: 0 auto; }

/* ── Controls ────────────────────────────── */
.row { display: flex; gap: 8px; margin-bottom: 12px; }
.row input { flex: 1; }
input, select, textarea {
  background: var(--bg2); border: 1px solid var(--border2); color: var(--text);
  border-radius: var(--radius); padding: 9px 13px; font-size: 13px; font-family: var(--sans);
  font-weight: 300; outline: none; transition: border-color .15s, box-shadow .15s;
}
input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(42,92,63,.08); }
input::placeholder { color: var(--text3); }
.tag-list { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; min-height: 28px; }
.tag {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 4px 10px 4px 13px; background: var(--accent-lt);
  border: 1px solid rgba(42,92,63,.15); border-radius: 99px; font-size: 12px; color: var(--accent);
}
.tag button {
  background: none; border: none; color: var(--accent-md); cursor: pointer;
  font-size: 14px; line-height: 1; padding: 0; opacity: .6; transition: opacity .15s;
}
.tag button:hover { opacity: 1; }
.chip {
  padding: 5px 13px; font-size: 12px; border: 1px solid var(--border2); border-radius: 99px;
  background: none; cursor: pointer; color: var(--text2); transition: all .15s;
  font-family: var(--sans); white-space: nowrap;
}
.chip:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-lt); }
.chip.active { border-color: var(--accent); color: var(--accent); background: var(--accent-lt); font-weight: 500; }
.btn {
  display: inline-flex; align-items: center; gap: 5px; padding: 8px 16px;
  border-radius: var(--radius); border: 1px solid var(--border2); background: var(--bg2);
  color: var(--text); font-size: 13px; cursor: pointer; transition: all .15s;
  font-family: var(--sans); font-weight: 300; white-space: nowrap;
}
.btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-lt); }
.btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 500; }
.btn.primary:hover { background: var(--accent-md); border-color: var(--accent-md); }
input[type=range] { width: 100%; accent-color: var(--accent); }

/* ── Item cards ──────────────────────────── */
.items-list { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
.item-card {
  background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius-lg);
  overflow: hidden; display: flex; flex-direction: column; position: relative;
  transition: box-shadow .2s, border-color .2s, transform .2s;
  text-decoration: none; color: inherit; cursor: pointer; box-shadow: var(--shadow-sm);
}
.item-card:hover { border-color: rgba(42,92,63,.2); box-shadow: var(--shadow); transform: translateY(-3px); }
.item-card.matched { border-color: rgba(42,92,63,.3); background: linear-gradient(160deg, var(--accent-lt) 0%, var(--bg2) 45%); }
.item-thumb { width: 100%; aspect-ratio: 1/1; object-fit: cover; display: block; background: var(--bg3); flex-shrink: 0; }
.item-thumb-ph { width: 100%; aspect-ratio: 1/1; flex-shrink: 0; background: var(--bg3); display: flex; align-items: center; justify-content: center; color: var(--text3); font-size: 36px; }
.item-card.soldout { opacity: 0.42; }
.item-card.soldout .item-title { text-decoration: line-through; color: var(--text3); }
.item-body { padding: 12px 13px 14px; flex: 1; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.item-top { display: flex; align-items: flex-start; gap: 4px; flex-wrap: wrap; }
.item-title {
  font-size: 12px; font-weight: 400; line-height: 1.55;
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
  overflow: hidden; width: 100%; color: var(--text);
}
.badge { font-size: 10px; padding: 2px 7px; border-radius: 99px; font-family: var(--mono); white-space: nowrap; flex-shrink: 0; }
.b-tokyo { background: var(--blue-lt); color: var(--blue); }
.b-shark { background: #e8f0ff; color: #1a3a8c; }
.b-restyle { background: #e8f5e9; color: #1b5e20; }
.b-furuichi { background: #e8f5f0; color: #1a6b5a; }
.b-timehype { background: #f5e8e8; color: #7a1a1a; }
.b-match { background: var(--accent-lt); color: var(--accent); }
.b-sold { background: #f0f0f0; color: #999; }
.b-new { background: var(--red-lt); color: var(--red); }
.item-meta { font-size: 11px; color: var(--text3); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.item-price { font-family: var(--mono); font-size: 14px; font-weight: 500; color: var(--text); letter-spacing: -.02em; }
mark { background: rgba(42,92,63,.12); color: var(--accent); border-radius: 3px; padding: 0 2px; }
.empty { text-align: center; padding: 5rem 2rem; color: var(--text3); font-size: 13px; line-height: 2.6; }
.divider { border: none; border-top: 1px solid var(--border); margin: 20px 0; }

/* ── Search panel ────────────────────────── */
.search-kw-section { margin-bottom: 32px; }
.search-kw-header {
  font-size: 16px; font-weight: 500; color: var(--text); letter-spacing: -.02em;
  padding-bottom: 10px; margin-bottom: 14px; border-bottom: 2px solid var(--accent-lt);
}
.search-link-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; }
.search-link-card {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 5px; padding: 18px 8px; background: var(--bg2); border: 1px solid var(--border);
  border-radius: var(--radius-lg); text-decoration: none; color: var(--text2);
  transition: all .15s; box-shadow: var(--shadow-sm); text-align: center; min-height: 86px;
}
.search-link-card:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-lt); box-shadow: var(--shadow); transform: translateY(-2px); }
.search-link-icon { font-size: 22px; line-height: 1; }
.search-link-name { font-size: 11px; font-weight: 400; line-height: 1.3; color: inherit; }
.search-link-count { font-family: var(--mono); font-size: 10px; color: var(--text3); }

/* ── Watch top bar ───────────────────────── */
.watch-topbar { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; align-items: center; margin-bottom: 20px; }
.watch-stat { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 16px; }
.watch-stat-n { font-family: var(--mono); font-size: 22px; font-weight: 500; color: var(--text); line-height: 1; }
.watch-stat-l { font-size: 10px; color: var(--text3); font-family: var(--mono); letter-spacing: .08em; text-transform: uppercase; margin-top: 4px; }

/* ── Filter card ─────────────────────────── */
.filter-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius-lg); margin-bottom: 20px; overflow: hidden; box-shadow: var(--shadow-sm); }
.filter-row { display: flex; align-items: stretch; border-bottom: 1px solid var(--border); }
.filter-col { padding: 11px 14px; display: flex; flex-direction: column; gap: 7px; min-width: 0; }
.filter-col.grow { flex: 1; }
.filter-sep { width: 1px; background: var(--border); flex-shrink: 0; }
.filter-lbl { font-family: var(--mono); font-size: 9px; color: var(--text3); letter-spacing: .12em; text-transform: uppercase; line-height: 1; }
.filter-chips-wrap { position: relative; overflow: hidden; min-width: 0; }
.filter-chips-wrap::after { content: ''; position: absolute; right: 0; top: 0; bottom: 0; width: 28px; background: linear-gradient(to right, transparent, var(--bg2)); pointer-events: none; }
.filter-chips { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
.filter-chips::-webkit-scrollbar { display: none; }
.filter-price { display: flex; flex-direction: column; gap: 8px; padding: 10px 14px; }
.filter-price-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
@media (max-width: 767px) { .filter-price-row .price-slider-wrap { flex: 1; width: auto; } }

/* ── Dual range price slider ─────────────── */
.price-slider-wrap { position: relative; width: 140px; height: 28px; flex-shrink: 0; }
.price-slider-track { position: absolute; top: 50%; left: 0; right: 0; height: 4px; transform: translateY(-50%); background: var(--bg3); border-radius: 2px; }
.price-slider-fill { position: absolute; top: 0; bottom: 0; background: var(--accent); border-radius: 2px; }
.price-range-thumb { position: absolute; width: 100%; top: 0; left: 0; height: 28px; background: none; pointer-events: none; -webkit-appearance: none; appearance: none; outline: none; margin: 0; padding: 0; }
.price-range-thumb::-webkit-slider-runnable-track { background: transparent; }
.price-range-thumb::-moz-range-track { background: transparent; }
.price-range-thumb::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none; width: 18px; height: 18px; border-radius: 50%;
  background: var(--accent); border: 2.5px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.25);
  pointer-events: all; cursor: grab; transition: transform .1s;
}
.price-range-thumb::-webkit-slider-thumb:active { transform: scale(1.1); cursor: grabbing; }
.price-range-thumb::-moz-range-thumb {
  width: 16px; height: 16px; border-radius: 50%; background: var(--accent);
  border: 2.5px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.25); pointer-events: all; cursor: grab;
}
@media (max-width: 767px) {
  .price-slider-wrap { width: 120px; height: 36px; }
  .price-range-thumb { height: 36px; }
  .price-range-thumb::-webkit-slider-thumb { width: 22px; height: 22px; }
  .price-range-thumb::-moz-range-thumb { width: 20px; height: 20px; }
}

/* ── Modal ───────────────────────────────── */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.45); backdrop-filter: blur(3px);
  display: flex; align-items: center; justify-content: center; z-index: 100; padding: 20px;
}
.modal {
  background: var(--bg2); border: 1px solid var(--border2); border-radius: var(--radius-lg);
  padding: 36px; width: 100%; max-width: 640px;
  box-shadow: 0 24px 64px rgba(0,0,0,.14), 0 4px 12px rgba(0,0,0,.08);
  max-height: 90vh; overflow-y: auto;
}
.modal-title { font-size: 18px; font-weight: 500; margin-bottom: 26px; display: flex; align-items: center; justify-content: space-between; }
.modal-close { background: none; border: none; color: var(--text3); cursor: pointer; font-size: 20px; padding: 0; transition: color .15s; }
.modal-close:hover { color: var(--text); }

/* ── Settings ────────────────────────────── */
.settings-section { margin-bottom: 28px; }
.settings-section:last-child { margin-bottom: 0; }
.settings-title { font-size: 13px; font-weight: 500; color: var(--text); margin-bottom: 14px; }
.settings-row { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
.settings-row label { font-size: 13px; color: var(--text2); width: 100px; flex-shrink: 0; font-weight: 400; }
.settings-row input, .settings-row select { flex: 1; }
.settings-row:last-child { margin-bottom: 0; }
.guide-box { background: var(--accent-lt); border: 1px solid rgba(42,92,63,.15); border-radius: var(--radius-lg); padding: 16px 18px; margin-bottom: 16px; }
.guide-title { font-size: 12px; font-weight: 500; color: var(--accent); margin-bottom: 8px; }
.guide-body { font-size: 12px; color: var(--text2); line-height: 2; font-weight: 300; }
.guide-body b { font-weight: 500; color: var(--text); }
.test-result { font-size: 13px; padding: 10px 14px; border-radius: var(--radius); margin-top: 12px; }
.test-ok { background: var(--accent-lt); color: var(--accent); }
.test-err { background: var(--red-lt); color: var(--red); }

/* ── お気に入りボタン ─────────────────────── */
.fav-btn {
  position: absolute; bottom: 8px; right: 8px; z-index: 2;
  width: 36px; height: 36px; border-radius: 50%; border: none; cursor: pointer;
  background: rgba(255,255,255,.9); color: var(--text3); opacity: 0;
  font-size: 18px; display: flex; align-items: center; justify-content: center;
  transition: opacity .2s, color .15s, background .15s, transform .15s;
  box-shadow: 0 2px 8px rgba(0,0,0,.12);
}
.item-card:hover .fav-btn { opacity: 1; }
.fav-btn.on { opacity: 1; color: #f59e0b; background: rgba(255,255,255,.95); }
.fav-btn:hover { opacity: 1; background: rgba(245,158,11,.1); color: #f59e0b; transform: scale(1.1); }

/* ── 通知ボタン ──────────────────────────── */
.notif-btn {
  background: none; border: 1px solid var(--border2); border-radius: var(--radius);
  padding: 0 10px; height: 34px; cursor: pointer; font-size: 13px; color: var(--text3);
  transition: all .15s; display: inline-flex; align-items: center; justify-content: center;
}
.notif-btn.on { color: var(--accent); border-color: var(--accent); background: var(--accent-lt); }
.notif-btn.denied { opacity: .4; cursor: default; }

/* ── Medium screens ──────────────────────── */
@media (max-width: 1079px) {
  .items-list { grid-template-columns: repeat(3, 1fr); }
}
@media (min-width: 768px) and (max-width: 1079px) {
  .topbar, .main-tabbar, .err-banner { padding-left: 24px; padding-right: 24px; }
  .content { padding: 24px; }
}

/* ── Mobile ──────────────────────────────── */
@media (max-width: 767px) {
  .topbar { padding: 0 16px; }
  .status-mini { display: none; }
  .main-tabbar { padding: 0 16px; }
  .err-banner { padding: 8px 16px; }
  .content { padding: 16px; }
  .items-list { grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .watch-topbar { grid-template-columns: 1fr; }
  .fav-btn { opacity: 1 !important; }
  .modal { padding: 22px; }
  .search-link-grid { grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); }
}
</style>
</head>
<body>


<!-- 設定モーダル -->
<div id="settingsModalOverlay" class="modal-overlay" onclick="if(event.target===this)closeSettings()" style="display:none">
  <div class="modal">
    <div class="modal-title">設定<button class="modal-close" onclick="closeSettings()">×</button></div>
    <div class="settings-section">
      <div class="settings-title">Cloudflare Worker</div>
      <div class="guide-box">
        <div class="guide-title">設定するとRSS取得が安定します（10万回/日 無料）</div>
        <div class="guide-body">
          <b>① </b><a href="https://dash.cloudflare.com" target="_blank" rel="noopener" style="color:var(--accent)">Cloudflareダッシュボード</a> → Workers &amp; Pages → Create Worker<br>
          <b>② </b>リポジトリの <b>worker.js</b> を貼り付けて Deploy<br>
          <b>③ </b>発行された <b>xxxxx.workers.dev</b> のURLを下に入力して保存
        </div>
      </div>
      <div class="settings-row"><label>Worker URL</label><input type="text" id="cfWorkerUrl" placeholder="https://kaguwatch-rss-proxy.xxxxx.workers.dev"></div>
      <div style="display:flex;gap:8px;margin-top:10px">
        <button class="btn primary" onclick="saveCfWorker()">保存</button>
        <button class="btn" onclick="testCfWorker()">接続テスト</button>
      </div>
      <div id="cfWorkerResult" style="display:none"></div>
    </div>
    <div class="divider"></div>
    <div class="settings-section">
      <div class="settings-title">自動更新間隔</div>
      <div class="settings-row"><label>間隔</label>
        <select id="intervalSel" onchange="updateInterval()">
          <option value="300">5分ごと（推奨）</option>
          <option value="600">10分ごと</option>
          <option value="180">3分ごと</option>
          <option value="60">1分ごと（負荷注意）</option>
        </select>
      </div>
    </div>
  </div>
</div>

<div class="shell">

  <!-- トップバー -->
  <header class="topbar">
    <div class="topbar-logo">
      <span class="logo-mark">KAGUWATCH</span>
      <span class="logo-sub">家具ウォッチャー</span>
    </div>
    <div class="topbar-right">
      <div class="status-mini">
        <span class="sdot loading" id="dot"></span>
        <span id="statusTxt">接続中...</span>
        <span class="ct" id="ctDown">5:00</span>
      </div>
      <button id="notifBtn" class="notif-btn" onclick="toggleNotif()" title="新着通知 — キーワード一致商品が出たときにデスクトップ通知">🔔</button>
      <button class="icon-btn" onclick="openSettings()" title="設定">⚙</button>
    </div>
  </header>

  <!-- エラーバナー -->
  <div class="err-banner" id="errBanner"></div>

  <!-- タブバー -->
  <div class="main-tabbar">
    <button class="main-tab active" id="tab-watch" onclick="switchMainTab('watch',this)">入荷監視</button>
    <button class="main-tab" id="tab-favorites" onclick="switchMainTab('favorites',this)">
      お気に入り<span class="tab-badge" id="favCount" style="display:none">0</span>
    </button>
    <button class="main-tab" id="tab-search" onclick="switchMainTab('search',this)">外部検索</button>
  </div>

  <main class="main">

    <!-- 入荷監視パネル -->
    <div id="panel-watch" class="main-panel active">
      <div class="content">
        <div class="watch-topbar">
          <div style="display:flex;gap:8px;align-items:center">
            <div style="position:relative;flex:1;min-width:0">
              <input type="text" id="watchSearch" placeholder="絞り込み検索　例：ソファ、テーブル" style="width:100%;padding-right:28px">

// ── Filter ────────────────────────────────────────────────────
const PRICE_SLIDER_MAX = 200000;
function _updatePriceFill() {
  const fill = document.getElementById('priceSliderFill');
  if (!fill) return;
  const pMin = minPrice / PRICE_SLIDER_MAX * 100;
  const pMax = maxPrice > 0 ? Math.min(maxPrice, PRICE_SLIDER_MAX) / PRICE_SLIDER_MAX * 100 : 100;
  fill.style.left = pMin + '%';
  fill.style.width = Math.max(pMax - pMin, 0) + '%';
  const minEl = document.getElementById('minPriceSlider');
  const maxEl = document.getElementById('maxPriceSlider');
  if (minEl && maxEl) {
    minEl.style.zIndex = parseInt(minEl.value) >= parseInt(maxEl.value) - 5000 ? '5' : '';
  }
}
function onMinSlider(val) {
  const maxV = parseInt(document.getElementById('maxPriceSlider').value);
  minPrice = Math.max(Math.min(parseInt(val) || 0, maxV - 5000), 0);
  document.getElementById('minPriceSlider').value = minPrice;
  document.getElementById('minPriceInput').value = minPrice > 0 ? minPrice : '';
  _updatePriceFill(); renderItems();
}
function onMaxSlider(val) {
  const v = parseInt(val) || PRICE_SLIDER_MAX;
  const minV = parseInt(document.getElementById('minPriceSlider').value);
  const clamped = Math.max(v, minV + 5000);
  maxPrice = clamped >= PRICE_SLIDER_MAX ? 0 : clamped;
  document.getElementById('maxPriceSlider').value = maxPrice > 0 ? maxPrice : PRICE_SLIDER_MAX;
  document.getElementById('maxPriceInput').value = maxPrice > 0 ? maxPrice : '';
  _updatePriceFill(); renderItems();
}

}
function setMaxPriceFromInput(val) {

// ── Parsing helpers ───────────────────────────────────────────
function extractSizes(text) {
  const t = (text||'').replace(/[Ｗｗ幅]/g,'W').replace(/[Ｈｈ高さ]/g,'H').replace(/[Ｄｄ奥行]/g,'D');
  const ps = [/W\s*(\d+)[^\d]+D\s*(\d+)[^\d]+H\s*(\d+)/i,/W(\d+)[\s×x]+D(\d+)[\s×x]+H(\d+)/i,/幅\s*(\d+)[^\d]*奥行[^\d]*(\d+)[^\d]*高さ[^\d]*(\d+)/,/(\d+)\s*[×x]\s*(\d+)\s*[×x]\s*(\d+)/];
  for (const p of ps) { const m=t.match(p); if(m) return {w:+m[1],d:+m[2]||0,h:+m[3]||+m[2]||0}; }
  return null;
}
function extractListPrice(text) {
  const m = (text||'').match(/(?:定価|参考価格|参考小売価格|メーカー希望価格|新品定価|希望小売価格|通常価格|新品価格)[：:\s]*([¥￥]?\s*[\d,]+\s*円?)/);
  return m ? m[1].trim() : null;
}
function extractPrice(text) {
  const t = text || '';
  let clean = t.replace(/<[^>]+>/g, ' ');
  clean = clean.replace(/送料(?!込|無料|は含|を含)[^\n¥￥\d]{0,25}[¥￥]?\s*[\d,]+\s*円?/gi, '');
  clean = clean.replace(/[¥￥]\s*[\d,]+\s*円?\s*[（(][^）)]{0,20}(?:送料|配送料|運送料)[^）)]{0,10}[）)]/gi, '');
  clean = clean.replace(/(?:定価|参考価格|希望小売価格|メーカー希望価格|通常価格|新品定価)[^\n¥￥\d]{0,20}[¥￥]?\s*[\d,]+\s*円?/gi, '');
  const ex = clean.match(/(?:販売価格|売価|本体価格|商品価格|価格)[：:\s]*([¥￥]\s*[\d,]+|[\d,]+\s*円)/);
  if (ex) return ex[1].replace(/\s/g, '');
  const m = clean.match(/[¥￥]\s*[\d,]+|[\d,]+\s*円/);
  return m ? m[0].replace(/\s/g, '') : null;
}
function isSoldOut(text) { return /sold[\s-]?out|在庫切れ|売り切れ|売切れ|完売|ソールドアウト/i.test(text||''); }
function isMatch(t) { return keywords.length > 0 && keywords.some(k=>t.toLowerCase().includes(k.toLowerCase())); }
function hl(text) {
  let out = text;
  keywords.forEach(k => { out = out.replace(new RegExp(k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'), m=>`<mark>${m}</mark>`); });
  return out;
}
function parseDate(str) {
  if (!str) return '—';
  const d = new Date(str);
  return isNaN(d) ? str.slice(0,10) : d.toLocaleDateString('ja-JP',{month:'short',day:'numeric'});
}
function parseNum(priceStr) {
  if (!priceStr) return 0;
  const n = parseInt(String(priceStr).replace(/[^\d]/g, ''), 10);
  return isNaN(n) ? 0 : n;
}
function isTodayItem(ts) {
  if (!ts) return false;
  const d = new Date(ts), n = new Date();
  return d.getFullYear()===n.getFullYear() && d.getMonth()===n.getMonth() && d.getDate()===n.getDate();
}

// ── Render items ──────────────────────────────────────────────
function renderItems(keepLimit = false) {
  if (!keepLimit) renderLimit = 60;
  const mainEl = document.querySelector('.main');
  const sv = mainEl ? mainEl.scrollTop : 0;
  let items = allItems;
  if (watchQuery) {
    const terms = watchQuery.split(/\s+/).filter(Boolean);
    items = items.filter(i => { const t = i.title.toLowerCase(); return terms.every(term => t.includes(term)); });
  }
  if (currentFilter==='matched') items = items.filter(i=>i.matched);
  else if (currentFilter==='favorites') items = items.filter(i=>!!favoriteItems[i.link]);
  else if (currentFilter!=='all') items = items.filter(i=>i.source===currentFilter);
  if (minPrice > 0 || maxPrice > 0) {
    items = items.filter(i => {
      const p = parseNum(i.price);
      if (p <= 0) return false;
      if (minPrice > 0 && p < minPrice) return false;
      if (maxPrice > 0 && p > maxPrice) return false;
      return true;
    });
  }
  if (sortOrder === 'price_asc' || sortOrder === 'price_desc') {
    const getP = i => parseNum(i.price) || (sortOrder==='price_asc' ? Infinity : -1);
    items = [...items].sort((a,b) => sortOrder==='price_asc' ? getP(a)-getP(b) : getP(b)-getP(a));
  }
  const hasSearch = !!watchQuery;
  document.getElementById('sMatch').textContent = hasSearch ? items.length : '—';
  document.getElementById('sTotal').textContent = allItems.length;
  document.getElementById('sShops').textContent = RSS_FEEDS.filter(f=>!f.disabled).length;

  const el = document.getElementById('itemsList');
  if (!items.length) { el.innerHTML='<div class="empty">該当するアイテムがありません<br>キーワードやフィルター条件を調整してみてください</div>'; return; }
  el.innerHTML = items.slice(0, renderLimit).map(item => {
    const feed = RSS_FEEDS.find(f=>f.id===item.source);
    const thumb = item.thumbnail
      ? `<img class="item-thumb" src="${item.thumbnail}" alt="" loading="lazy" onerror="this.style.display='none'">`
      : `<div class="item-thumb-ph">🛋</div>`;
    const isFav = !!favoriteItems[item.link];
    const encodedLink = item.link.replace(/'/g,"\\'");
    return `<a class="item-card${item.soldOut?' soldout':''}" href="${item.link}" target="_blank" rel="noopener">
      <span class="fav-btn${isFav?' on':''}" onclick="toggleFavorite('${encodedLink}',event)" title="${isFav?'お気に入りを解除':'お気に入りに追加'}">★</span>
      ${thumb}
      <div class="item-body">
        <div class="item-top">
          <span class="badge ${feed.badge}">${feed.name}</span>
          ${isTodayItem(item.ts)?'<span class="badge b-new">NEW</span>':''}
          ${item.soldOut?'<span class="badge b-sold">SOLD</span>':''}
        </div>
        <div class="item-title">${hl(item.title)}</div>
        <div class="item-meta">
          ${item.price?`<span class="item-price">${item.price}</span>`:''}
          ${item.listPrice?`<span style="font-size:10px;color:var(--text3)">定価 ${item.listPrice}</span>`:''}
        </div>
        <div class="item-meta" style="margin-top:auto;padding-top:4px"><span>${item.date}</span></div>
      </div>
    </a>`;
  }).join('');
  const remaining = items.length - renderLimit;
  if (remaining > 0) {
    el.innerHTML += `<div style="grid-column:1/-1;text-align:center;padding:16px 0 8px">
      <button class="btn" onclick="loadMoreItems()" style="min-width:160px">もっと見る（残り${remaining}件）</button>
    </div>`;
  }
  if (mainEl && sv > 0) mainEl.scrollTop = sv;
}
function loadMoreItems() { renderLimit += 60; renderItems(true); }

// ── XML / RSS parsing ─────────────────────────────────────────
function gbt(el, tag) { return [...el.getElementsByTagNameNS('*', tag)]; }
function gbt1(el, tag) { return el.getElementsByTagNameNS('*', tag)[0]; }
function parseXmlFeed(xmlStr, feed) {
  const doc = new DOMParser().parseFromString(xmlStr, 'text/xml');
  if (doc.querySelector('parsererror')) throw new Error('XML parse error');
  const isAtom = gbt(doc, 'feed').length > 0;
  const entries = gbt(doc, isAtom ? 'entry' : 'item');
  return entries.slice(0, 40).map(e => {
    let title, link, pubDate, desc, thumb;
    if (isAtom) {
      title = gbt1(e, 'title')?.textContent?.trim() || '—';
      const links = gbt(e, 'link');
      link = (links.find(l => l.getAttribute('rel') === 'alternate') || links[0])?.getAttribute('href') || feed.site;
      pubDate = gbt1(e, 'published')?.textContent || gbt1(e, 'updated')?.textContent;
      desc = gbt1(e, 'content')?.textContent || gbt1(e, 'summary')?.textContent || '';
      thumb = gbt1(e, 'thumbnail')?.getAttribute('url') || desc.match(/<img[^>]+src=["']([^"']+)["']/i)?.[1] || null;
    } else {
      title = gbt1(e, 'title')?.textContent?.trim() || '—';
      link = gbt1(e, 'link')?.textContent?.trim() || feed.site;
      pubDate = gbt1(e, 'pubDate')?.textContent;
      desc = gbt1(e, 'description')?.textContent || '';
      thumb = gbt1(e, 'thumbnail')?.getAttribute('url') || gbt(e, 'enclosure').find(el => el.getAttribute('type')?.startsWith('image'))?.getAttribute('url') || desc.match(/<img[^>]+src=["']([^"']+)["']/i)?.[1] || null;
    }
    const full = title + ' ' + desc;
    const ts = pubDate ? (new Date(pubDate).getTime() || 0) : 0;
    return { source:feed.id, title, link, date:parseDate(pubDate), ts, thumbnail:thumb, price:extractPrice(full), listPrice:extractListPrice(full), sizes:extractSizes(full), matched:isMatch(full), soldOut:isSoldOut(full), isNew:false };
  }).filter(item => !/様専用|専用決済/.test(item.title));
}

// ── Fetch helpers ─────────────────────────────────────────────
function fetchWithTimeout(url, timeoutMs) {
  const ctrl = new AbortController();
  const tid = setTimeout(() => ctrl.abort(), timeoutMs);
  return fetch(url, { signal: ctrl.signal }).finally(() => clearTimeout(tid));
}
async function fetchViaCfWorker(feed) {
  if (!cfWorkerUrl) throw new Error('no worker configured');
  const res = await fetchWithTimeout(cfWorkerUrl + '?url=' + encodeURIComponent(feed.url), 12000);
  if (!res.ok) throw new Error('worker HTTP ' + res.status);
  const xml = await res.text();
  if (!xml || xml.trim().length < 30) throw new Error('empty');
  return parseXmlFeed(xml, feed);
}
async function fetchViaCorsproxy(feed) {
  const res = await fetchWithTimeout('https://corsproxy.io/?' + encodeURIComponent(feed.url), 12000);
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const xml = await res.text();
  if (!xml || xml.trim().length < 30) throw new Error('empty');
  return parseXmlFeed(xml, feed);
}
async function fetchViaAllOrigins(feed) {
  const res = await fetchWithTimeout(ALLORIGINS + encodeURIComponent(feed.url), 12000);
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const j = await res.json();
  if (!j.contents || j.contents.trim().length < 30) throw new Error('empty');
  return parseXmlFeed(j.contents, feed);
}
async function fetchViaRss2json(feed) {
  const res = await fetchWithTimeout(R2J + encodeURIComponent(feed.url) + '&count=40', 10000);
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const data = await res.json();
  if (data.status !== 'ok') throw new Error(data.message || 'rss2json error');
  return (data.items||[]).map(item => {
    const full = item.title + ' ' + (item.description || '');
    const ts = item.pubDate ? (new Date(item.pubDate).getTime() || 0) : 0;
    return { source:feed.id, title:item.title||'—', link:item.link||feed.site, date:parseDate(item.pubDate), ts, thumbnail:item.thumbnail||item.enclosure?.link||null, price:extractPrice(full), listPrice:extractListPrice(full), sizes:extractSizes(full), matched:isMatch(full), soldOut:isSoldOut(full), isNew:false };
  }).filter(item => !/様専用|専用決済/.test(item.title));
}

// ── Shopify ───────────────────────────────────────────────────
const SHOPIFY_CACHE_TTL = 60 * 60 * 1000;
const shopifyBgFetching = new Set();
let _bgRenderTimer = null;
function scheduleBackgroundRender() {
  clearTimeout(_bgRenderTimer);
  _bgRenderTimer = setTimeout(() => { accumulateItems(allItems); renderItems(); }, 800);
}
function processShopifyRawProducts(products, feed) {
  const items = [];
  for (const p of products) {
    if (!p.variants.some(v => v.available)) continue;
    if (/様専用|専用決済/.test(p.title)) continue;
    const variant = p.variants[0];
    const priceNum = parseFloat(variant.price || '0');
    const compareNum = parseFloat(variant.compare_at_price || '0');
    const price = priceNum > 0 ? `¥${Math.round(priceNum).toLocaleString()}` : '';
    const listPrice = compareNum > priceNum ? `¥${Math.round(compareNum).toLocaleString()}` : '';
    const thumb = p.images[0]?.src || null;
    const link = `https://${feed.shopifyStore}/products/${p.handle}`;
    const pubAt = p.published_at || p.created_at;
    const ts = new Date(pubAt).getTime() || 0;
    items.push({ source:feed.id, title:p.title, link, date:parseDate(pubAt), ts, thumbnail:thumb, price, listPrice, sizes:extractSizes(p.title), matched:isMatch(p.title), soldOut:false, isNew:false });
  }
  return items;
}
async function fetchShopifyPage(feed, page) {
  const url = `https://${feed.shopifyStore}/products.json?limit=250&sort_by=created-descending&page=${page}`;
  const res = await fetchWithTimeout(cfWorkerUrl + '?url=' + encodeURIComponent(url), 15000);
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return (await res.json()).products || [];
}
async function fetchShopifyProducts(feed) {
  const cacheKey = 'shopify2_' + feed.id;
  let staleItems = null;
  try {
    const cached = JSON.parse(localStorage.getItem(cacheKey) || 'null');
    if (cached) {
      const items = cached.items.map(item => ({ ...item, matched: isMatch(item.title) }));
      if (Date.now() - cached.ts < SHOPIFY_CACHE_TTL) return items;
      staleItems = items;
    }
  } catch(e) {}
  if (!cfWorkerUrl) { if (staleItems) return staleItems; throw new Error('Worker URL 未設定'); }
  if (staleItems) {
    if (!shopifyBgFetching.has(feed.id)) {
      shopifyBgFetching.add(feed.id);
      fetchShopifyProductsBackground(feed, [], cacheKey, 1).finally(() => shopifyBgFetching.delete(feed.id));
    }
    return staleItems;
  }
  const raw1 = await fetchShopifyPage(feed, 1);
  const firstItems = processShopifyRawProducts(raw1, feed);
  if (raw1.length < 250) {
    try { localStorage.setItem(cacheKey, JSON.stringify({ ts: Date.now(), items: firstItems })); } catch(e) {}
    return firstItems;
  }
  if (!shopifyBgFetching.has(feed.id)) {
    shopifyBgFetching.add(feed.id);
    fetchShopifyProductsBackground(feed, firstItems, cacheKey, 2).finally(() => shopifyBgFetching.delete(feed.id));
  }
  return firstItems;
}
async function fetchShopifyProductsBackground(feed, initialItems, cacheKey, startPage = 2) {
  const bgItems = [...initialItems];
  let page = startPage;
  while (true) {
    try {
      const raw = await fetchShopifyPage(feed, page);
      bgItems.push(...processShopifyRawProducts(raw, feed));
      if (raw.length < 250) break;
      page++;
    } catch(e) { console.warn('[shopify bg]', feed.name, 'p' + page, e.message); break; }
  }
  if (!bgItems.length) return;
  try { localStorage.setItem(cacheKey, JSON.stringify({ ts: Date.now(), items: bgItems })); } catch(e) {}
  allItems = allItems.filter(i => i.source !== feed.id).concat(bgItems).sort((a, b) => b.ts - a.ts);
  scheduleBackgroundRender();
}
async function fetchFeed(feed) {
  if (feed.shopifyStore) {
    try { return await fetchShopifyProducts(feed); }
    catch(e) { console.warn('[shopify]', feed.name, '失敗 → RSSフォールバック:', e.message); if (!feed.url) throw e; }
  }
  const fns = cfWorkerUrl
    ? [fetchViaCfWorker, fetchViaCorsproxy, fetchViaAllOrigins, fetchViaRss2json]
    : [fetchViaCorsproxy, fetchViaAllOrigins, fetchViaRss2json];
  for (const fn of fns) { try { return await fn(feed); } catch(e) {} }
  throw new Error(feed.name + ': 全プロキシ失敗');
}

// ── Item history ──────────────────────────────────────────────
function accumulateItems(items) {
  let changed = false;
  items.forEach(item => {
    if (item.link && !itemHistory[item.link]) {
      itemHistory[item.link] = { title: item.title, source: item.source, ts: item.ts };
      changed = true;
    }
  });
  if (changed) {
    const keys = Object.keys(itemHistory);
    if (keys.length > 5000) {
      keys.sort((a,b) => (itemHistory[a].ts||0)-(itemHistory[b].ts||0)).slice(0, keys.length-5000).forEach(k => delete itemHistory[k]);
    }
    localStorage.setItem('itemHistory', JSON.stringify(itemHistory));
  }
  document.getElementById('sTotalAll').textContent = Object.keys(itemHistory).length;
}

// ── Load all feeds ────────────────────────────────────────────
async function loadAll() {
  setStatus('loading','取得中...');
  const results = await Promise.allSettled(RSS_FEEDS.filter(f=>!f.disabled).map(fetchFeed));
  let combined = [], errs = [];
  results.forEach((r,i) => { if(r.status==='fulfilled') combined=combined.concat(r.value); else errs.push(RSS_FEEDS[i].name); });
  const newLinks = new Set(combined.map(i=>i.link));
  let nc = 0;
  combined = combined.map(item => { const n=prevLinks.size>0&&!prevLinks.has(item.link); if(n)nc++; return {...item,isNew:n}; });
  prevLinks = newLinks;
  allItems = combined.sort((a,b)=>b.ts-a.ts);
  document.getElementById('sNew').textContent = nc>0?`+${nc}`:'—';
  const banner = document.getElementById('errBanner');
  if (errs.length && !combined.length) {
    setStatus('err', '取得失敗');
    if (banner) { banner.style.display=''; banner.innerHTML=`${errs.join('・')} の取得に失敗しました。<button onclick="openSettings()" style="background:none;border:none;color:var(--red);text-decoration:underline;cursor:pointer;font-size:12px;padding:0 4px">→ 設定を確認</button>`; }
  } else if (errs.length) {
    setStatus('err', `一部失敗 (${errs.length}店)`);
    if (banner) { banner.style.display=''; banner.innerHTML=`${errs.join('・')} を取得できませんでした`; }
  } else {
    setStatus('ok', `更新 ${new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})}`);
    if (banner) banner.style.display='none';
  }
  renderItems();
  accumulateItems(allItems);
  sendNewItemNotif(allItems);
  startCd();
}

// ── Favorites ─────────────────────────────────────────────────
function toggleFavorite(link, e) {
  e.preventDefault(); e.stopPropagation();
  if (favoriteItems[link]) {
    delete favoriteItems[link];
  } else {
    const item = allItems.find(i => i.link === link);
    if (item) favoriteItems[link] = { link:item.link, title:item.title, thumbnail:item.thumbnail, source:item.source, price:item.price, date:item.date, ts:item.ts };
  }
  try { localStorage.setItem('favoriteItems', JSON.stringify(favoriteItems)); } catch(_) {}
  updateFavCount();
  renderItems();
  if (document.getElementById('panel-favorites').classList.contains('active')) renderFavorites();
}
function updateFavCount() {
  const n = Object.keys(favoriteItems).length;
  const el = document.getElementById('favCount');
  if (!el) return;
  el.textContent = n;
  el.style.display = n > 0 ? '' : 'none';
}
function renderFavorites() {
  const el = document.getElementById('favList');
  const favs = Object.values(favoriteItems).sort((a,b) => b.ts-a.ts);
  if (!favs.length) { el.innerHTML='<div class="empty">お気に入りはまだありません<br>商品カードの ★ をタップして保存できます</div>'; return; }
  const shopifyIds = new Set(RSS_FEEDS.filter(f=>f.shopifyStore).map(f=>f.id));
  el.innerHTML = favs.map(item => {
    const live = allItems.find(i=>i.link===item.link);
    const feed = RSS_FEEDS.find(f=>f.id===item.source);
    const isSold = (!live && shopifyIds.has(item.source)) || (live && live.soldOut);
    const currentPrice = live?.price || item.price;
    const thumb = item.thumbnail
      ? `<img class="item-thumb" src="${item.thumbnail}" alt="" loading="lazy" onerror="this.style.display='none'">`
      : `<div class="item-thumb-ph">🛋</div>`;
    return `<a class="item-card${isSold?' soldout':''}" href="${item.link}" target="_blank" rel="noopener">
      <span class="fav-btn on" onclick="toggleFavorite('${item.link.replace(/'/g,"\\'")}',event)" title="お気に入りを解除">★</span>
      ${thumb}
      <div class="item-body">
        <div class="item-top">
          <span class="badge ${feed?.badge||''}">${feed?.name||item.source}</span>
          ${isSold?'<span class="badge b-sold">売り切れ</span>':''}
        </div>
        <div class="item-title">${item.title}</div>
        <div class="item-meta">${currentPrice?`<span class="item-price">${currentPrice}</span>`:''}</div>
        <div class="item-meta" style="margin-top:auto;padding-top:4px"><span>${item.date}</span></div>
      </div>
    </a>`;
  }).join('');
}

// ── Notifications ─────────────────────────────────────────────
function updateNotifBtn() {
  const btn = document.getElementById('notifBtn');
  if (!btn) return;
  const perm = Notification.permission;
  btn.className = 'notif-btn' + (perm==='granted'?' on':perm==='denied'?' denied':'');
  btn.title = perm==='granted'?'通知オン（クリックでオフ）':perm==='denied'?'通知がブロックされています':'通知をオンにする';
}
async function toggleNotif() {
  if (Notification.permission==='denied') return;
  if (Notification.permission==='granted') { alert('通知を止めるにはブラウザの設定から変更してください。'); return; }
  await Notification.requestPermission();
  updateNotifBtn();
}
function sendNewItemNotif(items) {
  if (Notification.permission!=='granted') return;
  const newMatched = items.filter(i=>i.isNew&&i.matched);
  if (!newMatched.length) return;
  if (newMatched.length===1) {
    const item = newMatched[0];
    new Notification(`🛋 新着: ${item.title}`, { body:item.price||'', icon:'/favicon.ico' });
  } else {
    new Notification(`🛋 キーワード一致 ${newMatched.length}件の新着`, { body:newMatched.slice(0,3).map(i=>i.title).join('\n'), icon:'/favicon.ico' });
  }
}

// ── Countdown ─────────────────────────────────────────────────
function startCd() {
  if (countRef) clearInterval(countRef);
  countdown = intervalSec;
  countRef = setInterval(() => {
    countdown--;
    const m=Math.floor(countdown/60), s=countdown%60;
    document.getElementById('ctDown').textContent = `${m}:${String(s).padStart(2,'0')}`;
    if (countdown<=0) { clearInterval(countRef); loadAll(); }
  }, 1000);
}
function manualRefresh() {
  RSS_FEEDS.filter(f=>f.shopifyStore).forEach(f => { localStorage.removeItem('shopify_'+f.id); localStorage.removeItem('shopify2_'+f.id); });
  if (countRef) clearInterval(countRef);
  loadAll();
}
function updateInterval() { intervalSec=parseInt(document.getElementById('intervalSel').value); if(countRef)clearInterval(countRef); startCd(); }

// ── Search links ──────────────────────────────────────────────
function renderSearch() {
  const el = document.getElementById('searchShops');
  if (!keywords.length) {
    el.innerHTML = '<div class="empty">キーワードを追加すると<br>各サイトへのリンクが表示されます</div>';
    return;
  }
  el.innerHTML = keywords.map(kw => `
    <div class="search-kw-section">
      <div class="search-kw-header">${kw}</div>
      <div class="search-link-grid">
        ${SEARCH_SHOPS.map(s => `
          <a class="search-link-card" href="${s.url(kw)}" target="_blank" rel="noopener">
            <span class="search-link-icon">${s.icon}</span>
            <span class="search-link-name">${s.name}</span>
            ${s.noCount ? '' : `<span class="search-link-count" id="hit-${CSS.escape(s.name+kw)}">—</span>`}
          </a>`).join('')}
      </div>
    </div>`).join('');
  if (cfWorkerUrl) fetchHitCounts();
}

// ── Hit counts ────────────────────────────────────────────────
function extractHitCount(html) {
  const multiNums = [];
  const multiPats = [/([\d,]+)\s*(?:件|点)\s*中/g, /すべて[^０-９\d\n\r]{0,60}([\d,]+)\s*(?:件|点)/g];
  for (const re of multiPats) { let m; while((m=re.exec(html))!==null){const n=+m[1].replace(/,/g,'');if(n>0&&n<9999999)multiNums.push(n);} }
  if (multiNums.length>0) return Math.min(...multiNums).toLocaleString()+'件';
  const singlePats = [/([\d,]+)\s*(?:件|点)\s*が見つかり/,/検索結果[^\d\n]{0,20}([\d,]+)\s*(?:件|点)/,/([\d,]+)\s*(?:件|点)\s*の投稿/,/([\d,]+)\s*(?:件|点)\s*の商品/,/全\s*([\d,]+)\s*(?:件|点)/,/<title[^>]*>[^<]*?([\d,]{4,})\s*(?:件|点)[^<]*<\/title>/i];
  for (const re of singlePats) { const m=html.match(re); if(m){const n=+m[1].replace(/,/g,'');if(n>0&&n<9999999)return n.toLocaleString()+'件';} }
  const candidates = [];
  const nextDataM = html.match(/<script[^>]+id=["']__NEXT_DATA__["'][^>]*>([\s\S]*?)<\/script>/i);
  if (nextDataM) {
    try {
      const isSearchKey = k=>/^(?:searchCount|searchHitCount|resultCount|hitCount|hitNum|numHits|num_hits|total_hits|totalResultCount|searchResultCount|numResult|searchTotal|searchHitTotal)$/i.test(k);
      const isGeneralKey = k=>/^(?:numItems|totalCount|total_count|numOfItems|totalNum|itemCount|allCount|total|count)$/i.test(k);
      let searchBest = null;
      const scanForCount = (obj,depth) => {
        if (depth>14||!obj||typeof obj!=='object') return;
        for (const [k,v] of Object.entries(obj)) {
          if (typeof v==='number'&&v>0&&v<9999999){if(isSearchKey(k)&&searchBest===null)searchBest=v;else if(isGeneralKey(k))candidates.push(v);}
          if (v&&typeof v==='object') scanForCount(v,depth+1);
        }
      };
      scanForCount(JSON.parse(nextDataM[1]),0);
      if (searchBest!==null) return searchBest.toLocaleString()+'件';
    } catch(e) {}
  }
  const searchRe = /"(?:searchCount|searchHitCount|resultCount|hitCount|hitNum|numHits|num_hits|totalResultCount|searchResultCount|numResult|searchHitTotal|searchFoundCount)"\s*:\s*(\d+)/g;
  let m;
  while((m=searchRe.exec(html))!==null){const n=+m[1];if(n>0&&n<9999999)return n.toLocaleString()+'件';}
  const jsonRe = /"(?:numItems|totalCount|total_count|numOfItems|totalNum|total|count|num_hits|total_hits|itemCount|productCount|totalItems|totalProducts|totalHits|found|matches|hits|allCount)"\s*:\s*(\d+)/g;
  while((m=jsonRe.exec(html))!==null){const n=+m[1];if(n>0&&n<9999999)candidates.push(n);}
  const jpRe = /(\d[\d,]*)\s*(?:件|点)/g;
  while((m=jpRe.exec(html))!==null){const n=+m[1].replace(/,/g,'');if(n>0&&n<9999999)candidates.push(n);}
  if (!candidates.length) return null;
  return Math.max(...candidates).toLocaleString()+'件';
}
const hitCache = {};
async function fetchHitCounts() {
  for (const kw of keywords) {
    for (const shop of SEARCH_SHOPS) {
      if (shop.noCount) continue;
      const cacheKey = shop.name + kw;
      if (hitCache[cacheKey] !== undefined) { setHitCount(shop.name, kw, hitCache[cacheKey]); continue; }
      fetchOneHit(shop, kw, cacheKey);
    }
  }
}
async function fetchOneHit(shop, kw, cacheKey) {
  try {
    const res = await fetchWithTimeout(cfWorkerUrl+'?url='+encodeURIComponent(shop.url(kw)), 15000);
    if (!res.ok) throw new Error('HTTP '+res.status);
    const display = extractHitCount(await res.text());
    hitCache[cacheKey] = display||'—'; setHitCount(shop.name, kw, display||'—');
  } catch(e) { hitCache[cacheKey]='—'; setHitCount(shop.name, kw, '—'); }
}
function setHitCount(shopName, kw, text) {
  const el = document.getElementById('hit-'+CSS.escape(shopName+kw));
  if (el) el.textContent = text || '';
}

// ── Settings ──────────────────────────────────────────────────
function saveCfWorker() {
  cfWorkerUrl = document.getElementById('cfWorkerUrl').value.trim().replace(/\/$/, '');
  localStorage.setItem('cfWorkerUrl', cfWorkerUrl);
  const r = document.getElementById('cfWorkerResult');
  r.style.display=''; r.className='test-result test-ok'; r.textContent='✓ 保存しました';
}
async function testCfWorker() {
  const url = document.getElementById('cfWorkerUrl').value.trim().replace(/\/$/, '');
  const r = document.getElementById('cfWorkerResult');
  if (!url) { r.style.display=''; r.className='test-result test-err'; r.textContent='Worker URLを入力してください'; return; }
  r.style.display=''; r.className='test-result'; r.textContent='テスト中...';
  try {
    const res = await fetchWithTimeout(url+'?url='+encodeURIComponent(RSS_FEEDS[0].url), 10000);
    if (!res.ok) throw new Error('HTTP '+res.status);
    const text = await res.text();
    if (text.trim().length<30) throw new Error('empty response');
    r.className='test-result test-ok'; r.textContent='✓ 接続成功！RSS取得を確認しました';
  } catch(e) {
    r.className='test-result test-err'; r.textContent='接続失敗: '+e.message;
  }
}

function init() {
  renderTags();
  loadAll();
  _updatePriceFill();
  document.getElementById('sTotalAll').textContent = Object.keys(itemHistory).length;
  updateFavCount();
  updateNotifBtn();
}
init();
